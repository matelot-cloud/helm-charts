# Lints the published chart copy and checks the operator scripts parse (the chart itself is tested in the platform
# repository before every release; this is a smoke check for the public copy).
name: lint
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm lint charts/secops-cell
      - run: helm lint charts/secops-cell -f charts/secops-cell/values-production.example.yaml
      - run: helm template t charts/secops-cell --set tenant.slug=t --set tenant.domain=example.com > /dev/null
      - run: for f in scripts/*.sh scripts/lib/*.sh charts/secops-cell/files/*.sh; do bash -n "$f"; done
      - run: python3 -m py_compile scripts/lib/cellwait.py
